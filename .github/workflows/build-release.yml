name: Build Multi-Version macOS Universal spcomp Releases

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-versions:
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', '1.12', '1.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build macOS spcomp & includes for ${{ matrix.version }}
        run: |
          chmod +x ./scripts/build-spcomp-macos.sh
          ./scripts/build-spcomp-macos.sh ${{ matrix.version }} ./build-tmp ./dist-${{ matrix.version }}

      - name: Test compiled binary
        run: |
          file ./dist-${{ matrix.version }}/bin/spcomp-${{ matrix.version }}
          ./dist-${{ matrix.version }}/bin/spcomp-${{ matrix.version }} ./plugins/sample.sp -i./dist-${{ matrix.version }}/include/${{ matrix.version }} -o./sample-${{ matrix.version }}.smx
          ls -la ./sample-${{ matrix.version }}.smx

      - name: Create release archives
        run: |
          cd dist-${{ matrix.version }}
          tar -czf ../sourcemod-${{ matrix.version }}-macos-universal.tar.gz bin/ include/
          zip -r ../sourcemod-${{ matrix.version }}-macos-universal.zip bin/ include/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sourcemod-${{ matrix.version }}-macos-universal
          path: |
            sourcemod-${{ matrix.version }}-macos-universal.tar.gz
            sourcemod-${{ matrix.version }}-macos-universal.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sourcemod-${{ matrix.version }}-macos-universal.tar.gz
            sourcemod-${{ matrix.version }}-macos-universal.zip
          draft: false
          prerelease: false
          generate_release_notes: true
